name: CI

on:
    pull_request:
        branches:
            - master

jobs:
    code_quality:
        name: Lint, type check, and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout with ags-types submodule
              uses: actions/checkout@v7.0.1
              with:
                  submodules: true

            - name: Provide the Astal GJS package
              # package.json depends on 'astal' via the file: path
              # /usr/share/astal/gjs; the runner needs it before npm install.
              run: sudo git clone --depth 1 https://github.com/Jas-SinghFSU/astalgjs.git /usr/share/astal

            - name: Node Setup
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: "26"

            - name: Bootstrap dependencies
              # Installs npm packages, verifies the astal dependency layout,
              # and copies the GIR type declarations (incl. overrides) into
              # @girs/ — the same path a contributor follows. Build tools are
              # skipped: this job runs the Node-side quality gates only.
              run: npm run bootstrap -- --skip-build-tools

            - name: ESLint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Tests
              run: npm test
